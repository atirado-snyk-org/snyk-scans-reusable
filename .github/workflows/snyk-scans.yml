name: Snyk scans (reusable)

# Reusable workflow_call version of the jobs validated in Finding 9/10 of the
# PR-check investigation. Scanning logic is unchanged from that validation —
# only relocated here and parameterized so a caller can pick which of the
# five Snyk products to run and where to run them from.
#
# Auth note (Finding 11): uses a Snyk Service Account's OAuth2 client
# credentials (`snyk auth --auth-type=oauth`), not a static SNYK_TOKEN. This
# is why every job runs `snyk/actions/iac`/`snyk/actions/docker` replaced with
# direct CLI calls (`snyk iac test` / `snyk container test`) instead of the
# marketplace wrapper actions used in Finding 9/10 — those wrappers run the
# CLI inside their own pre-pulled Docker image (confirmed via job logs: "Pull
# snyk/snyk:alpine" / "Pull snyk/snyk:docker"), a separate container from the
# runner a prior `snyk auth` step would have authenticated, and no OAuth
# client-credential support is confirmed for them. Direct CLI calls on the
# host runner let one `snyk auth` step authenticate every subsequent step in
# that job.
#
# Dashboard visibility note (Finding 13): every job above runs a stateless
# `test`-family command — none of it creates a persistent Project visible in
# the Snyk web UI. `report_to_ui` (default false) opts into that separately,
# confirmed empirically per product before being added here:
#   - Open Source: separate `snyk monitor` command
#   - Container: separate `snyk container monitor` command
#   - IaC, Code, Secrets: `--report` flag on the same `test` command
#   - Code specifically REQUIRES `--project-name` with `--report` (confirmed:
#     fails with a generic SNYK-CLI-0000 without it); IaC and Secrets do not.
# Caveat, observed but not fully characterized: CLI-driven monitor/--report
# calls appeared to register under their own target identity in testing,
# distinct from a target the native GitHub SCM integration may have already
# created for the same repo — expect a second, separate-looking entry in the
# Snyk dashboard rather than a clean merge into one.
on:
  workflow_call:
    inputs:
      run_open_source:
        description: "Run Snyk Open Source (snyk test)"
        type: boolean
        default: true
      run_code:
        description: "Run Snyk Code (snyk code test)"
        type: boolean
        default: true
      run_iac:
        description: "Run Snyk IaC (snyk iac test)"
        type: boolean
        default: true
      run_container:
        description: "Run Snyk Container (snyk container test)"
        type: boolean
        default: true
      run_secrets:
        description: "Run Snyk Secrets standalone (see README caveat: additive to, not a replacement for, the native SCM integration check, which already works reliably)"
        type: boolean
        default: false
      report_to_ui:
        description: >-
          Also register a persistent Project in the Snyk web UI for each
          enabled product (snyk monitor / snyk container monitor / --report),
          separate from the stateless PR-check scan above. Default false —
          opt in only if you want dashboard visibility in addition to PR
          gating. See this file's own header comment for the per-product
          mechanism and a caveat about target-identity duplication.
        type: boolean
        default: false
      working_directory:
        description: "Directory to run Open Source / Code / IaC scans from, relative to repo root"
        type: string
        default: "."
      severity_threshold:
        description: "Minimum severity that fails Open Source / IaC / Container jobs (low|medium|high|critical)"
        type: string
        default: "medium"
      dockerfile_path:
        description: "Path to the Dockerfile for the Container job, relative to repo root"
        type: string
        default: "Dockerfile"
    secrets:
      SNYK_CLIENT_ID:
        required: true
      SNYK_CLIENT_SECRET:
        required: true

jobs:
  snyk-open-source:
    if: inputs.run_open_source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # --no-audit --no-fund is required, not optional: plain `npm install` on
      # GitHub-hosted runners can silently run npm's own registry-advisory
      # lookup for 6+ minutes on some dependency sets (see Finding 9's rough
      # edge). Drop this flag only if you've confirmed your own manifests
      # don't hit that path.
      - run: npm install --no-audit --no-fund
      - uses: snyk/actions/setup@master
      - name: Snyk auth (service account, OAuth2)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_CLIENT_ID" --client-secret="$SNYK_CLIENT_SECRET"
        env:
          SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
          SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      - name: Snyk Open Source test
        run: snyk test --all-projects --severity-threshold=${{ inputs.severity_threshold }}
      - name: Snyk Open Source monitor (dashboard visibility)
        if: always() && inputs.report_to_ui
        run: snyk monitor --all-projects --project-name=${{ github.repository }}

  snyk-code:
    if: inputs.run_code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk auth (service account, OAuth2)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_CLIENT_ID" --client-secret="$SNYK_CLIENT_SECRET"
        env:
          SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
          SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      - name: Snyk Code test
        run: snyk code test
      # --project-name is not optional here — confirmed empirically:
      # `snyk code test --report` alone fails with a generic SNYK-CLI-0000.
      - name: Snyk Code report (dashboard visibility)
        if: always() && inputs.report_to_ui
        run: snyk code test --report --project-name=${{ github.repository }}

  snyk-iac:
    if: inputs.run_iac
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk auth (service account, OAuth2)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_CLIENT_ID" --client-secret="$SNYK_CLIENT_SECRET"
        env:
          SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
          SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      - name: Snyk IaC test
        run: snyk iac test --severity-threshold=${{ inputs.severity_threshold }}
      - name: Snyk IaC report (dashboard visibility)
        if: always() && inputs.report_to_ui
        run: snyk iac test --report

  snyk-container:
    if: inputs.run_container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk auth (service account, OAuth2)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_CLIENT_ID" --client-secret="$SNYK_CLIENT_SECRET"
        env:
          SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
          SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      - name: Build image
        run: docker build -t "scan-target:${{ github.sha }}" -f "${{ inputs.dockerfile_path }}" .
      - name: Snyk Container test
        run: snyk container test "scan-target:${{ github.sha }}" --file=${{ inputs.dockerfile_path }} --severity-threshold=${{ inputs.severity_threshold }}
      - name: Snyk Container monitor (dashboard visibility)
        if: always() && inputs.report_to_ui
        run: snyk container monitor "scan-target:${{ github.sha }}" --file=${{ inputs.dockerfile_path }} --project-name=${{ github.repository }}

  # Additive, not a replacement: Snyk Secrets already works reliably via the
  # native SCM integration (Finding 1/3/7/10) — this is offered so a customer
  # who wants ONE uniform mechanism across all five products, with no
  # dependency on Snyk's server-side import/status behavior at all, can pick
  # that instead. Default is `false`, unlike the other four, precisely so it
  # stays opt-in rather than implying Secrets needed fixing too.
  #
  # No dedicated `snyk/actions/secrets` variant exists in snyk/actions as of
  # this writing (confirmed against the actions repo directly) — this uses
  # the CLI's own `snyk secrets test` command instead. Requires the Secrets
  # feature to be enabled as an entitlement on your Snyk org (separate from
  # the other four); a missing entitlement fails with SNYK-CLI-0016, which
  # this job does NOT try to distinguish from a real finding — check job logs
  # if this fails and you don't expect it to.
  snyk-secrets:
    if: inputs.run_secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk auth (service account, OAuth2)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_CLIENT_ID" --client-secret="$SNYK_CLIENT_SECRET"
        env:
          SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
          SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      - name: Snyk Secrets test
        run: snyk secrets test --severity-threshold=${{ inputs.severity_threshold }}
      - name: Snyk Secrets report (dashboard visibility)
        if: always() && inputs.report_to_ui
        run: snyk secrets test --report
